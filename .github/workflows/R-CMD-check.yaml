name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel',    http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          build_args: 'character()'
          upload-snapshots: true

      - name: Show check logs on failure
        if: failure()
        shell: bash
        run: |
          echo "Contents of check/:"
          find check -maxdepth 4 -type f | sort || true
          for f in $(find check -type f \( -name '00check.log' -o -name '00install.out' \) 2>/dev/null); do
            echo "::group::${f}"
            sed -n '1,240p' "$f" || true
            echo "::endgroup::"
          done

      - name: Upload check directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-dir-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
          if-no-files-found: warn

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-logs-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: |
            check/**/00check.log
            check/**/00install.out
            *.Rcheck/00check.log
            *.Rcheck/00install.out
          if-no-files-found: warn

  minimum-and-minimal:
    name: R ${{ matrix.r }} with minimal optional dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: ['4.1', 'release']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          dependencies: '"hard"'
          extra-packages: |
            any::tinytest
            any::knitr
            any::remotes
      - name: Install minimum upstream versions on R 4.1
        if: matrix.r == '4.1'
        shell: Rscript {0}
        run: |
          remotes::install_version("bsvars", version = "3.2", dependencies = FALSE, upgrade = "never")
          remotes::install_version("bsvarSIGNs", version = "2.0", dependencies = FALSE, upgrade = "never")
          stopifnot(packageVersion("bsvars") == "3.2", packageVersion("bsvarSIGNs") == "2.0")
      - name: Confirm integration packages are absent
        shell: Rscript {0}
        run: |
          optional <- c("APRScenario", "flextable", "gt", "tsibble")
          stopifnot(!any(vapply(optional, requireNamespace, logical(1), quietly = TRUE)))
      - name: Install and test
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript --vanilla -e 'tinytest::test_package("bsvarPost")'
          Rscript --vanilla tools/check-documentation.R --fixtures-only

  optional-integrations-and-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::covr
      - name: Confirm integration packages are installed
        shell: Rscript {0}
        run: |
          optional <- c("APRScenario", "flextable", "gt", "tsibble")
          stopifnot(all(vapply(optional, requireNamespace, logical(1), quietly = TRUE)))
      - name: Run instrumented tests and save coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests")
          output <- file.path(Sys.getenv("RUNNER_TEMP"), "coverage")
          dir.create(output, recursive = TRUE, showWarnings = FALSE)
          covr::to_cobertura(coverage, filename = file.path(output, "cobertura.xml"))
          utils::write.csv(as.data.frame(coverage), file.path(output, "coverage.csv"), row.names = FALSE)
          print(coverage)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: warn
