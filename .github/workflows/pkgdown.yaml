name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website
      - name: Build and install package with vignettes
        shell: bash
        run: |
          R CMD build .
          R CMD INSTALL bsvarPost_*.tar.gz
      - name: Test documentation checker
        run: Rscript --vanilla tools/test-doc-qa.R
      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      - name: Check README, installed scripts, links and figures
        run: Rscript --vanilla tools/check-documentation.R --installed-docs --site=docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkgdown-site
          path: docs
          if-no-files-found: warn

  deploy:
    needs: documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
