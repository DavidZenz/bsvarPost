url: https://davidzenz.github.io/bsvarPost/
template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: bsvarPost
  description: >
    Posterior analysis for Bayesian structural VARs estimated with bsvars and
    bsvarSIGNs, including cumulative responses, historical decompositions,
    comparison of model specifications, posterior inference, identification
    diagnostics, and statistical reporting.
  sidebar:
    structure:
      - links
      - license
      - community
      - citation
      - authors
      - dev

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Introduction
      href: articles/bsvarPost.html
    articles:
      text: Articles
      menu:
        - text: Post-estimation Analysis with bsvarPost
          href: articles/bsvarPost.html
        - text: Inference and Comparison
          href: articles/inference-and-comparison.html
        - text: Historical Decompositions
          href: articles/historical-decomposition-events.html
        - text: Analysis of Sign-Restricted Models
          href: articles/sign-restricted-workflows.html
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/DavidZenz/bsvarPost

articles:
  - title: Articles
    navbar: Articles
    contents:
      - bsvarPost
      - inference-and-comparison
      - historical-decomposition-events
      - sign-restricted-workflows

