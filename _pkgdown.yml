url: https://davidzenz.github.io/bsvarPost/
template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: bsvarPost
  description: >
    A post-estimation companion package for bsvars and bsvarSIGNs, focused on
    cumulative responses, historical decomposition workflows, tidy extraction,
    comparison workflows, diagnostics, and publication-ready reporting.
  sidebar:
    structure:
      - links
      - license
      - community
      - citation
      - authors
      - dev

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/bsvarPost.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/bsvarPost.html
        - text: Inference and Comparison
          href: articles/inference-and-comparison.html
        - text: Historical-Decomposition Events
          href: articles/historical-decomposition-events.html
        - text: Sign-Restricted Workflows
          href: articles/sign-restricted-workflows.html
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/DavidZenz/bsvarPost

articles:
  - title: Articles
    navbar: Articles
    contents:
      - bsvarPost
      - inference-and-comparison
      - historical-decomposition-events
      - sign-restricted-workflows

